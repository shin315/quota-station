[workspace]
resolver = "2"
members = ["crates/quota-station-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/shin315/quota-station"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
