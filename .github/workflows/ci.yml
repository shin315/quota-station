name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: reuse lint
        uses: fsfe/reuse-action@v5

  build:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Vitest
        run: npm test

      # Without QS_ANTIGRAVITY_ACCOUNTS the build stops if it would bundle a
      # file from src/antigravity/ (CC BY-NC-SA 4.0).
      - name: Type check and build the frontend (MIT)
        run: npm run build

      - name: Build the frontend with the Antigravity accounts
        run: npx vite build
        env:
          QS_ANTIGRAVITY_ACCOUNTS: "1"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Clippy (MIT)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with the Antigravity accounts
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts -- -D warnings

      - name: cargo test (MIT)
        run: cargo test --workspace --locked

      - name: cargo test with the Antigravity accounts
        run: cargo test --workspace --locked --features antigravity-accounts

      - name: Build the app (MIT)
        run: npx tauri build --bundles app
