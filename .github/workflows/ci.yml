name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: reuse lint
        uses: fsfe/reuse-action@v5

  build:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Vitest
        run: npm test

      # Without QS_ANTIGRAVITY_ACCOUNTS the build stops if it would bundle a
      # file from src/antigravity/ (CC BY-NC-SA 4.0).
      - name: Type check and build the frontend (MIT)
        run: npm run build

      - name: Build the frontend with the Antigravity accounts
        run: npx vite build
        env:
          QS_ANTIGRAVITY_ACCOUNTS: "1"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Clippy (MIT)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with the Antigravity accounts
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts -- -D warnings

      # The tools made for the author's own Macs (Cài đặt › Nâng cao): left
      # out of the default and release builds, built by scripts/install.sh.
      - name: Clippy with the author's tools
        run: cargo clippy --workspace --all-targets --locked --features author-tools -- -D warnings

      - name: Clippy as scripts/install.sh builds
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts,author-tools -- -D warnings

      - name: cargo test (MIT)
        run: cargo test --workspace --locked

      - name: cargo test with the Antigravity accounts
        run: cargo test --workspace --locked --features antigravity-accounts

      - name: cargo test with the author's tools
        run: cargo test --workspace --locked --features author-tools

      - name: cargo test as scripts/install.sh builds
        run: cargo test --workspace --locked --features antigravity-accounts,author-tools

      - name: Build the app (MIT)
        run: npx tauri build --bundles app

  # The Windows build: vitest (the windows as Windows draws them, the
  # *.win.test.tsx files among them), and the core and the app crate:
  # clippy and their tests in the two feature sets Windows builds (the
  # author's tools are Unix only). The macOS job stays the required check.
  build-windows:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Vitest
        run: npm test

      - name: cargo check (core)
        run: cargo check -p quota-station-core --target x86_64-pc-windows-msvc --locked

      - name: cargo test (core)
        run: cargo test -p quota-station-core --locked --no-fail-fast

      - name: cargo test (core, Antigravity accounts)
        run: cargo test -p quota-station-core --locked --no-fail-fast --features antigravity-accounts

      - name: Clippy (MIT)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with the Antigravity accounts
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts -- -D warnings

      - name: cargo test (app)
        run: cargo test -p quota-station --locked --no-fail-fast

      - name: cargo test (app, Antigravity accounts)
        run: cargo test -p quota-station --locked --no-fail-fast --features antigravity-accounts
