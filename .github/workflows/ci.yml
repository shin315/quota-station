name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Repository variables pick where the jobs run; a repository that sets none
# runs as it always has, on GitHub's hosted runners:
#
# - MAC_RUNNER: the runner labels of the macOS jobs and of the two small jobs
#   (Licenses (REUSE), Changed files), as a JSON array (for example
#   ["self-hosted","macOS","ARM64"]); unset, macos-latest for the macOS jobs
#   and ubuntu-latest for the two small ones. Never set it to a self-hosted
#   runner in a public repository: a pull request from anyone would run on
#   that machine.
# - MAC_CI_ROOT: on MAC_RUNNER, the folder outside the workspace that the
#   macOS jobs keep their Rust in, and which outlives each run: the
#   toolchain (rustup/, RUSTUP_HOME), Cargo's own folder (cargo/,
#   CARGO_HOME) and the build (target/), instead of the Rust cache action.
#   The toolchain action then installs and picks its toolchain there, never
#   in the account's own ~/.rustup and ~/.cargo, so a runner that runs as
#   someone's own account leaves their Rust alone. A runner can name its
#   own folder instead: QS_CI_ROOT in the runner's own environment (the
#   .env file in its directory, which every job it runs inherits) comes
#   first, so runners on different machines each keep theirs, and
#   MAC_CI_ROOT serves a runner that sets none. A job on MAC_RUNNER stops
#   when neither is set, or when rustup is not on the runner's PATH (the
#   action would otherwise install rustup itself). Licenses (REUSE) keeps its
#   uv tool cache (uv-cache/, UV_CACHE_DIR) and tool folder (uv-tools/,
#   UV_TOOL_DIR) there too, and stops when neither is set. Unused without
#   MAC_RUNNER.
# - WINDOWS_ON_PUSH: "false" runs the Windows job only when the workflow is
#   started by hand (Actions › CI › Run workflow); unset, on every change.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licenses (REUSE)
    runs-on: ${{ vars.MAC_RUNNER && fromJSON(vars.MAC_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: reuse lint
        if: ${{ !vars.MAC_RUNNER }}
        uses: fsfe/reuse-action@v5

      # MAC_RUNNER has no Docker, which the action needs: the same tool (the
      # 5.x line the action runs) through uv, kept in the CI root (the
      # runner's QS_CI_ROOT, else MAC_CI_ROOT). uv comes from the runner's
      # PATH, or is installed into the CI root when it is not there.
      - name: reuse lint (MAC_RUNNER)
        if: ${{ vars.MAC_RUNNER }}
        env:
          MAC_CI_ROOT: ${{ vars.MAC_CI_ROOT }}
        run: |
          ROOT="${QS_CI_ROOT:-$MAC_CI_ROOT}"
          if [ -z "$ROOT" ]; then
            echo "::error::MAC_RUNNER is set but neither the runner's QS_CI_ROOT nor MAC_CI_ROOT is: set one to the folder the jobs keep their tools in."
            exit 1
          fi
          mkdir -p "$ROOT"
          export UV_CACHE_DIR="$ROOT/uv-cache" UV_TOOL_DIR="$ROOT/uv-tools"
          if ! command -v uvx >/dev/null 2>&1; then
            python3 -m venv "$ROOT/uv-venv"
            "$ROOT/uv-venv/bin/python" -m pip install --quiet --upgrade uv
            PATH="$ROOT/uv-venv/bin:$PATH"
          fi
          uvx --from 'reuse[charset-normalizer]==5.1.1' reuse lint

  # Whether the change touches anything but the docs: *.md anywhere and the
  # docs/ directory. When it does not, the two build jobs are skipped; the
  # licence check above always runs. If the diff cannot be read (a new
  # branch, a history that was forced over, this job failing) the builds run.
  changes:
    name: Changed files
    runs-on: ${{ vars.MAC_RUNNER && fromJSON(vars.MAC_RUNNER) || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Anything besides the docs?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && files=$(git diff --name-only --no-renames "$BASE...$HEAD_SHA") && [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            if [ -z "$(grep -vE '\.md$|^docs/' <<<"$files" || true)" ]; then
              code=false
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.MAC_RUNNER && fromJSON(vars.MAC_RUNNER) || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # MAC_RUNNER's own machine: the toolchain and the builds in the CI
      # root (the runner's QS_CI_ROOT, else MAC_CI_ROOT), set before the
      # toolchain action so that it installs there (checkout empties the
      # workspace's ignored files on every run).
      - name: Rust outside the workspace (MAC_RUNNER)
        if: ${{ vars.MAC_RUNNER }}
        env:
          MAC_CI_ROOT: ${{ vars.MAC_CI_ROOT }}
        run: |
          ROOT="${QS_CI_ROOT:-$MAC_CI_ROOT}"
          if [ -z "$ROOT" ]; then
            echo "::error::MAC_RUNNER is set but neither the runner's QS_CI_ROOT nor MAC_CI_ROOT is: set one to the folder the jobs keep their Rust in."
            exit 1
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not on the runner's PATH; the toolchain action would install it into this account."
            exit 1
          fi
          mkdir -p "$ROOT"
          {
            echo "RUSTUP_HOME=$ROOT/rustup"
            echo "CARGO_HOME=$ROOT/cargo"
            echo "CARGO_TARGET_DIR=$ROOT/target"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: ${{ !vars.MAC_RUNNER }}

      - name: Install npm packages
        run: npm ci

      - name: Vitest
        run: npm test

      # Without QS_ANTIGRAVITY_ACCOUNTS the build stops if it would bundle a
      # file from src/antigravity/ (CC BY-NC-SA 4.0).
      - name: Type check and build the frontend (MIT)
        run: npm run build

      - name: Build the frontend with the Antigravity accounts
        run: npx vite build
        env:
          QS_ANTIGRAVITY_ACCOUNTS: "1"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Clippy (MIT)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with the Antigravity accounts
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts -- -D warnings

      - name: cargo test (MIT)
        run: cargo test --workspace --locked

      - name: cargo test with the Antigravity accounts
        run: cargo test --workspace --locked --features antigravity-accounts

      - name: Build the app (MIT)
        run: npx tauri build --bundles app

  # The Windows build: vitest (the windows as Windows draws them, the
  # *.win.test.tsx files among them), and the core and the app crate:
  # clippy and their tests with and without the Antigravity accounts (the
  # core's with the rotation, its rules, the pause and the rotation timer;
  # the copies to other Macs over SSH, the LaunchAgent and the update from
  # source are Unix only), then the guided sessions' test installer. The
  # macOS job stays the required check.
  build-windows:
    name: Build and test (Windows x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (vars.WINDOWS_ON_PUSH != 'false' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      # The whole history: the test installer's build number is the count
      # of commits up to the one built (src-tauri/build.rs), which a
      # shallow clone does not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Vitest
        run: npm test

      - name: cargo check (core)
        run: cargo check -p quota-station-core --target x86_64-pc-windows-msvc --locked

      - name: cargo test (core)
        run: cargo test -p quota-station-core --locked --no-fail-fast

      - name: cargo test (core, Antigravity accounts)
        run: cargo test -p quota-station-core --locked --no-fail-fast --features antigravity-accounts

      - name: Clippy (MIT)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with the Antigravity accounts
        run: cargo clippy --workspace --all-targets --locked --features antigravity-accounts -- -D warnings

      - name: cargo test (app)
        run: cargo test -p quota-station --locked --no-fail-fast

      - name: cargo test (app, Antigravity accounts)
        run: cargo test -p quota-station --locked --no-fail-fast --features antigravity-accounts

      # The test installer for the guided sessions on a Windows PC (plan
      # 4.3): NSIS, unsigned on purpose, with the Antigravity accounts as the
      # build from source has them (CC BY-NC-SA 4.0, NOTICE), so its bundle's
      # licence reads MIT AND CC-BY-NC-SA-4.0. The MIT build stays proven by
      # the clippy and test runs without the feature here and by the macOS
      # job's MIT app. QS_TEST_SESSION makes it open the session's guide and
      # write diag-<date>.zip; no release carries it.
      - name: Build the session's test installer (NSIS, unsigned)
        run: npx tauri build --bundles nsis --features antigravity-accounts --config src-tauri/tauri.antigravity.conf.json
        env:
          QS_TEST_SESSION: "1"
          QS_ANTIGRAVITY_ACCOUNTS: "1"

      - name: Upload the session's test installer
        uses: actions/upload-artifact@v4
        with:
          name: quota-station-windows-x64-test-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
