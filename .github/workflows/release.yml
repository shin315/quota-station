name: Release

# Builds a release and leaves it as a draft for the owner to publish
# (docs/releasing.md). Started only by hand: Actions › Release › Run workflow.
#
# - dry_run (the default): builds the macOS disk image (ad-hoc signature, as a
#   build from source has), the Windows installer and their updater files,
#   writes SHA256SUMS.txt, latest.json and the notes, and keeps them as the
#   run's artifacts. The updater files are signed with a throwaway key each
#   job makes for itself, so they show their shape but can never install.
#   It uses no environment and no secret, and creates no tag, release or
#   environment.
# - dry_run off: src-tauri/updater.pub must hold the update key's public
#   half. The macOS and Windows jobs run in the `release` environment (its
#   reviewer approves them), sign the updater files with the update key, and
#   the macOS job signs the app with Developer ID, notarizes and staples the
#   app and the disk image; then the last job creates a draft release
#   v<version> on the built commit with the assets. Never a published
#   release, never a tag: GitHub creates the tag when the owner presses
#   Publish on the draft.
#
# The installers keep the names the app's update check looks for
# (crates/quota-station-core/src/release.rs, `installs`): the first `.dmg`
# on macOS, the file ending in `_x64-setup.exe` on Windows x64. The updater
# (src-tauri/src/updater.rs) reads latest.json from the latest release,
# which points at the macOS `.app.tar.gz` and the Windows `-setup.exe`, each
# with its `.sig`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in Cargo.toml, tauri.conf.json and package.json (for example 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build unsigned, keep the files as artifacts, create nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: The commit to build
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A version with a pre-release part (1.0.0-rc.1) is never offered by
      # the app's update check, so it is refused here.
      - name: The version is the one in the files
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, tomllib
          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.exit(f"::error::version {version!r} is not MAJOR.MINOR.PATCH")
          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["workspace"]["package"]["version"]
          with open("src-tauri/tauri.conf.json") as f:
              tauri = json.load(f)["version"]
          with open("package.json") as f:
              npm = json.load(f)["version"]
          found = {"Cargo.toml": cargo, "src-tauri/tauri.conf.json": tauri, "package.json": npm}
          wrong = {k: v for k, v in found.items() if v != version}
          for k, v in wrong.items():
              print(f"::error file={k}::{k} says {v}, not {version}")
          if wrong:
              sys.exit(1)
          print(f"Version {version} in " + ", ".join(found))
          EOF

      # The app checks every update's signature against this key; a release
      # built without it could never be installed by the updater.
      - name: The update key's public half is committed
        if: ${{ !inputs.dry_run }}
        run: python3 -I -B scripts/updater_feed.py check-key src-tauri/updater.pub

      - name: The tag does not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "No tag v$VERSION yet"

      # A real run only from main, and only once the owner has made the
      # `release` environment with a required reviewer and limited branches
      # and tags: a job naming an environment that does not exist would
      # create it, unprotected. Anyone with read access may read an
      # environment's settings (this job's token, or none in a public
      # repository); when they cannot be read, the run stops all the same.
      - name: A real run starts from main, in a protected environment
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is built from main, not $GITHUB_REF"
            exit 1
          fi
          err="$RUNNER_TEMP/environment.err"
          if ! rules="$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[].type] | join(",")' 2>"$err")"; then
            if grep -q 'HTTP 404' "$err"; then
              echo "::error::the release environment does not exist (docs/releasing.md)"
            else
              cat "$err"
              echo "::error::could not read the release environment's settings, so whether it is protected is unknown: stopping"
            fi
            exit 1
          fi
          echo "Environment release: ${rules:-no protection rules}"
          for rule in required_reviewers branch_policy; do
            case ",$rules," in
              *",$rule,"*) ;;
              *)
                echo "::error::the release environment lacks $rule (docs/releasing.md)"
                exit 1
                ;;
            esac
          done

  macos:
    name: macOS (universal disk image)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 120
    # The signing secrets live in this environment, and only a real run
    # enters it; a dry run names none.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    env:
      QS_ANTIGRAVITY_ACCOUNTS: "1"
      QS_RELEASE: "1"
      APP: target/universal-apple-darwin/release/bundle/macos/Quota Station.app
      UPDATER: target/universal-apple-darwin/release/bundle/macos/Quota Station.app.tar.gz
    steps:
      # The whole history: the build number is the count of commits up to
      # the one built. No caches: a release builds from nothing.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Rust (stable, both Mac architectures)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Commit and build number
        run: |
          echo "QS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QS_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Install npm packages
        run: npm ci

      - name: A throwaway update key (dry run)
        if: ${{ inputs.dry_run }}
        run: bash scripts/updater-dry-key.sh

      - name: Build the app, disk image and updater file (dry run, ad-hoc signature)
        if: ${{ inputs.dry_run }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --features antigravity-accounts --config src-tauri/tauri.antigravity.conf.json --config src-tauri/tauri.updater.conf.json --config "$UPDATER_DRY_CONFIG"

      - name: The signing secrets are there
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::secrets missing in the release environment:$missing"
            exit 1
          fi
          echo "All eight signing secrets are set"

      # The App Store Connect key as the file Tauri and notarytool read,
      # readable only by this job's user; deleted in the last step.
      - name: Write the App Store Connect key
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Tauri reads these: it imports the certificate into a keychain of its
      # own, signs with the hardened runtime and src-tauri/Entitlements.plist,
      # notarizes and staples the app, then signs the disk image. The updater
      # file is the stapled app, archived, signed with the update key
      # (src-tauri/tauri.updater.conf.json, its public half in
      # src-tauri/updater.pub).
      - name: Build, sign and notarize the app and disk image, sign the updater file
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --features antigravity-accounts --config src-tauri/tauri.antigravity.conf.json --config src-tauri/tauri.updater.conf.json

      - name: Name the disk image
        run: |
          src="target/universal-apple-darwin/release/bundle/dmg/Quota Station_${VERSION}_universal.dmg"
          if [ ! -f "$src" ]; then
            echo "::error::no $src; the bundle folder holds:"
            ls -la target/universal-apple-darwin/release/bundle/dmg || true
            exit 1
          fi
          mkdir -p dist
          mv "$src" "dist/Quota.Station_${VERSION}_universal.dmg"
          echo "DMG=dist/Quota.Station_${VERSION}_universal.dmg" >> "$GITHUB_ENV"

      # Made after the app was signed, notarized and stapled.
      - name: Name the updater file
        run: |
          for f in "$UPDATER" "$UPDATER.sig"; do
            [ -f "$f" ] || { echo "::error::no $f"; ls -la "$(dirname "$UPDATER")" || true; exit 1; }
          done
          mv "$UPDATER" "dist/Quota.Station_${VERSION}_universal.app.tar.gz"
          mv "$UPDATER.sig" "dist/Quota.Station_${VERSION}_universal.app.tar.gz.sig"

      - name: Notarize and staple the disk image
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          out="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$out"
          id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$out")"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$out")"
          echo "Submission $id: $status"
          if [ "$status" != Accepted ]; then
            [ -z "$id" ] || xcrun notarytool log "$id" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::notarization of the disk image: ${status:-no answer}"
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Check the app
        run: |
          set -o pipefail
          bin="$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")"
          archs="$(lipo -archs "$APP/Contents/MacOS/$bin")"
          echo "Architectures: $archs"
          for arch in x86_64 arm64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::the app is not universal ($archs)"; exit 1 ;;
            esac
          done
          v="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          [ "$v" = "$VERSION" ] || { echo "::error::the app says version $v"; exit 1; }
          for f in LICENSE NOTICE LICENSES/CC-BY-NC-SA-4.0.txt; do
            [ -f "$APP/Contents/Resources/$f" ] || { echo "::error::no Contents/Resources/$f"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          # The updater file holds this app, as the updater puts it in place.
          unpacked="$RUNNER_TEMP/updater-app"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          tar -xzf "dist/Quota.Station_${VERSION}_universal.app.tar.gz" -C "$unpacked"
          v="$(plutil -extract CFBundleShortVersionString raw "$unpacked/Quota Station.app/Contents/Info.plist")"
          [ "$v" = "$VERSION" ] || { echo "::error::the updater file's app says version $v"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$unpacked/Quota Station.app"
          echo "UPDATER_APP=$unpacked/Quota Station.app" >> "$GITHUB_ENV"

      - name: Check the signature and notarization
        if: ${{ !inputs.dry_run }}
        run: |
          set -o pipefail
          info="$(codesign -dvv "$APP" 2>&1)"
          grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime Version)=' <<<"$info"
          grep -q '^Authority=Developer ID Application:' <<<"$info" \
            || { echo "::error::the app is not signed with Developer ID Application"; exit 1; }
          entitlements="$(codesign -d --entitlements - --xml "$APP" 2>/dev/null)"
          grep -q 'com.apple.security.automation.apple-events' <<<"$entitlements" \
            || { echo "::error::the app's signature lacks the Apple Events entitlement"; exit 1; }
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$UPDATER_APP"
          spctl --assess --type execute -vv "$UPDATER_APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Delete the App Store Connect key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quota-station-macos
          path: |
            dist/Quota.Station_${{ inputs.version }}_universal.dmg
            dist/Quota.Station_${{ inputs.version }}_universal.app.tar.gz
            dist/Quota.Station_${{ inputs.version }}_universal.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  # Not signed with a certificate (docs/releasing.md); the README explains
  # SmartScreen's step. The installer is also the updater file, signed with
  # the update key, whose secrets live in the environment a real run enters.
  windows:
    name: Windows x64 (installer)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    env:
      QS_ANTIGRAVITY_ACCOUNTS: "1"
      QS_RELEASE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Commit and build number
        run: |
          echo "QS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QS_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Install npm packages
        run: npm ci

      - name: A throwaway update key (dry run)
        if: ${{ inputs.dry_run }}
        run: bash scripts/updater-dry-key.sh

      - name: Build the installer (NSIS, dry run)
        if: ${{ inputs.dry_run }}
        run: npx tauri build --bundles nsis --features antigravity-accounts --config src-tauri/tauri.antigravity.conf.json --config src-tauri/tauri.updater.conf.json --config "$UPDATER_DRY_CONFIG"

      - name: Build the installer (NSIS), sign it for the updater
        if: ${{ !inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::secrets missing in the release environment:$missing"
            exit 1
          fi
          npx tauri build --bundles nsis --features antigravity-accounts --config src-tauri/tauri.antigravity.conf.json --config src-tauri/tauri.updater.conf.json

      - name: Name and check the installer
        run: |
          src="target/release/bundle/nsis/Quota Station_${VERSION}_x64-setup.exe"
          if [ ! -f "$src" ]; then
            echo "::error::no $src; the bundle folder holds:"
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          [ -f "$src.sig" ] || { echo "::error::no $src.sig"; exit 1; }
          mkdir -p dist
          exe="dist/Quota.Station_${VERSION}_x64-setup.exe"
          mv "$src" "$exe"
          mv "$src.sig" "$exe.sig"
          # The licences the app installs next to itself (bundle.resources).
          names="$(7z l -slt "$exe" | tr -d '\r' | sed -n 's/^Path = //p' | sed 's|.*[\\/]||')"
          for f in LICENSE NOTICE CC-BY-NC-SA-4.0.txt; do
            grep -qxF "$f" <<<"$names" || { echo "::error::the installer holds no $f"; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quota-station-windows
          path: |
            dist/Quota.Station_${{ inputs.version }}_x64-setup.exe
            dist/Quota.Station_${{ inputs.version }}_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  # The checksums, latest.json and the notes, kept as an artifact; a dry run
  # stops here and prints what the draft would hold.
  assemble:
    name: Checksums, latest.json and notes
    needs: [check, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quota-station-*
          path: release/assets
          merge-multiple: true

      - name: SHA256SUMS.txt and the notes
        run: |
          cd release/assets
          dmg="Quota.Station_${VERSION}_universal.dmg"
          exe="Quota.Station_${VERSION}_x64-setup.exe"
          tgz="Quota.Station_${VERSION}_universal.app.tar.gz"
          ls -la
          for f in "$dmg" "$exe" "$tgz" "$exe.sig" "$tgz.sig"; do
            [ -f "$f" ] || { echo "::error::no $f among the artifacts"; exit 1; }
          done
          sha256sum -- "$dmg" "$exe" "$tgz" > SHA256SUMS.txt
          cd ../..
          {
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md
            echo
            echo '```'
            cat release/assets/SHA256SUMS.txt
            echo '```'
          } > release/notes.md

      # The updater's feed: the universal app serves both Mac processors.
      # A real run checks each signature against src-tauri/updater.pub; a
      # dry run's are from throwaway keys.
      - name: latest.json
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pubkey=()
          [ "$DRY_RUN" = true ] || pubkey=(--pubkey src-tauri/updater.pub)
          python3 -I -B scripts/updater_feed.py manifest --version "$VERSION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            "${pubkey[@]}" \
            --entry "darwin-aarch64,darwin-x86_64=release/assets/Quota.Station_${VERSION}_universal.app.tar.gz" \
            --entry "windows-x86_64=release/assets/Quota.Station_${VERSION}_x64-setup.exe" \
            --out release/assets/latest.json

      - name: What the draft holds
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            say="Dry run: nothing is created (the updater files are signed with throwaway keys). A real run would create"
          else
            say="The next job creates"
          fi
          {
            echo "$say the draft release v$VERSION on $COMMIT, titled \"Quota Station $VERSION\", with:"
            echo
            ( cd release/assets && ls -l -- * | awk '{print "- " $NF " (" $5 " bytes)"}' )
            echo
            echo "Notes:"
            echo
            cat release/notes.md
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  # The only job with a write token, and only on a real run.
  release:
    name: Draft release
    needs: [check, assemble]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.version }}
          path: release

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::tag v$VERSION exists"
            exit 1
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | .html_url")"
          if [ -n "$existing" ]; then
            echo "::error::a release for v$VERSION is already there ($existing); delete the draft first"
            exit 1
          fi
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --draft --target "$COMMIT" \
            --title "Quota Station $VERSION" --notes-file release/notes.md \
            "release/assets/Quota.Station_${VERSION}_universal.dmg" \
            "release/assets/Quota.Station_${VERSION}_x64-setup.exe" \
