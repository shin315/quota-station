[package]
name = "quota-station"
description = "Quota Station: AI coding quota in the macOS menu bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-station-core = { path = "../crates/quota-station-core" }
serde.workspace = true
serde_json.workspace = true
# macos-private-api: the popover is a transparent window so macOS can draw
# its own popover material behind it (window effects need transparency).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
