[package]
name = "quota-station"
description = "Quota Station: AI coding quota in the macOS menu bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The Antigravity accounts tab: log in, read and switch accounts
# (CC BY-NC-SA 4.0, see `NOTICE`). `scripts/install.sh` builds with it; a
# build without it is MIT only.
antigravity-accounts = ["quota-station-core/antigravity-accounts"]
# The tools made for the author's own Macs: Cài đặt › Nâng cao and what it
# holds (see `quota-station-core`). Off by default and in a release build;
# `scripts/install.sh` builds with it.
author-tools = ["quota-station-core/author-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-station-core = { path = "../crates/quota-station-core" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# macos-private-api: the popover is a transparent window so macOS can draw
# its own popover material behind it (window effects need transparency).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# "Nhập file đăng nhập (JSON)": the system's own file picker, on macOS and Windows alike.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# URLs, folders and files, opened in the program the owner chose for them
# (`src/open.rs`), on macOS and Windows alike.
tauri-plugin-opener = "2"
url = "2.5"

# Windows: the taskbar's theme and the tray icon's size, the material,
# Transparency effects and High contrast, the popover's corners, the
# computer's name, and WebView2's browser keys (`src/winsys.rs`), at the
# versions Tauri itself builds on.
[target.'cfg(windows)'.dependencies]
# Launching at login (`src/login_item.rs`): the current user's `Run` key,
# as `tauri-plugin-autostart` writes it, without its macOS side.
auto-launch = "0.6"
# The test build's pictures of the app's own windows (`src/shot.rs`).
jpeg-encoder = "0.6"
# Toasts with buttons (`src/notify.rs`).
tauri-plugin-notification = "2.7"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "UI_ViewManagement",
  "Wdk_System_SystemServices",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# Whether toasts and launching at login are turned off in Settings.
windows-registry = "0.6"

# Notification cards with buttons: the system's UNUserNotificationCenter
# (`src/notify.rs`), the same bindings Tauri itself builds on.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSSet", "NSString"] }
# Launching at login: `SMAppService.mainApp` (`src/login_item.rs`).
objc2-service-management = { version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "objc2-foundation",
  "SMAppService",
  "SMErrors",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
