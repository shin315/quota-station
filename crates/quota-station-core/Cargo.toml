[package]
name = "quota-station-core"
description = "Reads the quota of Claude, Codex and Antigravity itself, turns it into the Quota Station snapshot, paces refreshes, keeps and switches the Claude accounts, keeps the rotation file in step across Macs, and logs in, reads the quota of and switches Antigravity accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The Antigravity accounts the app logs in, reads and switches itself
# (`src/antigravity/`), adapted from Cockpit Tools and so under
# CC BY-NC-SA 4.0 (`LICENSES/`, `NOTICE`). Off, the crate is MIT only and
# Antigravity is the one account signed in on this Mac, read-only.
antigravity-accounts = []
# The tools made for the author's own Macs (`author-tools`): the rotation
# editor and its copy to the other Macs over SSH, the copy of the agents'
# setup to another Mac, the update from a clone of the source, the
# Firstmate state file and alert, and the copy of the Claude accounts in
# claude-swap's layout (`docs/claude-accounts.md`). Off by default and in a
# release build; `scripts/install.sh` builds with it.
author-tools = []
# For the tests only: points the Google, Anthropic and ChatGPT endpoints at
# a local fake, lets a fake `security` stand in for the Keychain, and
# records every file the Antigravity module opens. The app never turns it on.
test-support = []

[dependencies]
base64 = "0.22"
# Touches Claude Code's lock folders (`claude/locks.rs`), folders included.
filetime = "0.2"
# The app's own lock file: `flock` on Unix, `LockFileEx` on Windows, on the
# workspace's Rust 1.85 (`File::try_lock` needs 1.89).
fs4 = { version = "1", features = ["sync"] }
# The offset of the local time zone, thread-safe on both systems
# (`local_time`); on Windows it carries its own copy of the tz database.
jiff = "0.2"
libc = "0.2"
md5 = "0.7"
# The features Cockpit Tools builds reqwest 0.12 with that shape a request:
# the default TLS (macOS's own) and the same Accept-Encoding.
reqwest = { version = "0.12", features = ["blocking", "json", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
# `raw_value`: the session logs' lines are read for their token fields
# only; the rest of a line is skipped without being copied (`stats`).
serde_json = { workspace = true, features = ["raw_value"] }
# The quota cache is named by the SHA-256 of the email, as Cockpit names it.
sha2 = "0.10"
# Git's object ids: a skill folder's tree hash, as `npx skills` records it.
sha1 = "0.10"
time.workspace = true
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# A link to a folder without Developer Mode (`os::link_dir`).
junction = "2"
# The command lines of the processes that run (`win::Tasks`), as Cockpit
# Tools reads them on Windows; never built on macOS, where it would ask for
# permissions `ps` does not need.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# Whether a process runs and a file's volume and index (`os`); the app's own
# secrets sealed by DPAPI, Claude Code's items in Credential Manager, a
# folder for its owner alone, a move that never replaces, and the
# environment kept in the registry (`win`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
quota-station-core = { path = ".", features = ["test-support"] }
