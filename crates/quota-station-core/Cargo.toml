[package]
name = "quota-station-core"
description = "Reads quota-axi, turns its JSON into the Quota Station snapshot, paces refreshes, switches Claude through claude-swap, keeps the rotation file in step across Macs, and logs in, reads the quota of and switches Antigravity accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The Antigravity accounts the app logs in, reads and switches itself
# (`src/antigravity/`), adapted from Cockpit Tools and so under
# CC BY-NC-SA 4.0 (`LICENSES/`, `NOTICE`). Off, the crate is MIT only and
# Antigravity is the account quota-axi reads, read-only.
antigravity-accounts = []
# For the tests only: points the Google endpoints at a local fake, lets a
# fake `security` stand in for the Keychain, and records every file the
# Antigravity module opens. The app never turns it on.
test-support = []

[dependencies]
base64 = "0.22"
libc = "0.2"
md5 = "0.7"
# The features Cockpit Tools builds reqwest 0.12 with that shape a request:
# the default TLS (macOS's own) and the same Accept-Encoding.
reqwest = { version = "0.12", features = ["blocking", "json", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
# `raw_value`: the session logs' lines are read for their token fields
# only; the rest of a line is skipped without being copied (`stats`).
serde_json = { workspace = true, features = ["raw_value"] }
# The quota cache is named by the SHA-256 of the email, as Cockpit names it.
sha2 = "0.10"
# Git's object ids: a skill folder's tree hash, as `npx skills` records it.
sha1 = "0.10"
time.workspace = true
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
quota-station-core = { path = ".", features = ["test-support"] }
