[package]
name = "quota-station-cli"
description = "Quota Station's `claude` commands without the app, for Linux (and Linux in WSL): keeps and switches the Claude accounts and runs the rotation from a systemd user timer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Its own binary name: the app's is `quota-station`, and two binaries of one
# name in one workspace collide in `target/`. It is installed as
# `quota-station` (docs/linux.md).
[[bin]]
name = "quota-station-cli"
path = "src/main.rs"

[dependencies]
quota-station-core = { path = "../quota-station-core" }
